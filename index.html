<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyBudget</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Personal finance</p>
          <h1>MyBudget</h1>
        </div>
        <div class="balance-pill">
          <span>Current balance</span>
          <strong id="headerBalance">€0.00</strong>
        </div>
      </header>

      <main class="dashboard">
        <section class="summary-grid" aria-label="Budget summary">
          <article class="summary-card accent">
            <p>Starting balance</p>
            <div class="summary-input-row">
              <span class="currency">€</span>
              <input id="startingBalance" type="number" step="0.01" value="0" aria-label="Starting balance" />
            </div>
          </article>

          <article class="summary-card">
            <p>Monthly income</p>
            <strong id="monthlyIncome">€0.00</strong>
          </article>

          <article class="summary-card">
            <p>Monthly expenses</p>
            <strong id="monthlyExpenses">€0.00</strong>
          </article>

          <article class="summary-card">
            <p>Projected 12-month balance</p>
            <strong id="projectedBalance">€0.00</strong>
          </article>
        </section>

        <section class="content-grid">
          <aside class="panel form-panel">
            <h2>Add income</h2>
            <form id="incomeForm" class="entry-form">
              <label>
                <span>Name</span>
                <input type="text" name="name" placeholder="Salary" required />
              </label>

              <div class="inline-fields">
                <label>
                  <span>Amount</span>
                  <input type="number" name="amount" min="0.01" step="0.01" required />
                </label>

                <label>
                  <span>Type</span>
                  <select name="kind">
                    <option value="regular">Regular</option>
                    <option value="one-off">One-off</option>
                  </select>
                </label>
              </div>

              <label>
                <span>Expected date</span>
                <input type="date" name="date" />
              </label>

              <button type="submit">Add income</button>
            </form>

            <h2>Add expense</h2>
            <form id="expenseForm" class="entry-form">
              <label>
                <span>Name</span>
                <input type="text" name="name" placeholder="Rent" required />
              </label>

              <div class="inline-fields">
                <label>
                  <span>Amount</span>
                  <input type="number" name="amount" min="0.01" step="0.01" required />
                </label>

                <label>
                  <span>Type</span>
                  <select name="kind">
                    <option value="regular">Regular</option>
                    <option value="one-off">One-off</option>
                  </select>
                </label>
              </div>

              <label>
                <span>Expected date</span>
                <input type="date" name="date" />
              </label>

              <button type="submit" class="secondary">Add expense</button>
            </form>
          </aside>

          <section class="panel data-panel">
            <div class="panel-header">
              <h2>Budget overview</h2>
              <div class="toggle-group" aria-label="View mode toggle">
                <button class="mode-toggle active" data-view="table" type="button">Table view</button>
                <button class="mode-toggle" data-view="graph" type="button">Graph view</button>
              </div>
            </div>

            <div class="metrics-row">
              <div class="mini-card">
                <span>Net total</span>
                <strong id="netTotal">€0.00</strong>
              </div>
              <div class="mini-card">
                <span>Income total</span>
                <strong id="incomeTotal">€0.00</strong>
              </div>
              <div class="mini-card">
                <span>Expense total</span>
                <strong id="expenseTotal">€0.00</strong>
              </div>
            </div>

            <div id="tableView" class="view-panel active">
              <div class="table-wrapper">
                <table>
                  <thead>
                    <tr>
                      <th>Item</th>
                      <th>Type</th>
                      <th>Schedule</th>
                      <th>Amount</th>
                      <th>Date</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody id="itemsTableBody"></tbody>
                </table>
              </div>
            </div>

            <div id="graphView" class="view-panel" aria-live="polite">
              <svg id="budgetChart" viewBox="0 0 620 260" role="img" aria-label="Projected budget chart"></svg>
            </div>
          </section>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
